# supabase cli config. only the bits daily booth relies on.
project_id = "daily-booth"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_confirmations = false

[storage]
enabled = true

[functions.tick]
verify_jwt = false

[functions.notify]
verify_jwt = false
