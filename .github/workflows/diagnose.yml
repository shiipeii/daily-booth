# temporary: checks database permissions. prints counts and errors only.
name: diagnose
on:
  push:
    paths: [".github/workflows/diagnose.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg q "$1" '{query:$q}')"; echo; }
          echo "== role"; q "select current_user, rolbypassrls, rolsuper from pg_roles where rolname = current_user"
          echo "== owner of my_couple_id"; q "select p.proname, r.rolname, r.rolbypassrls from pg_proc p join pg_roles r on r.oid = p.proowner where p.proname in ('my_couple_id','create_couple')"
          echo "== counts as admin"; q "select (select count(*) from public.members) m, (select count(*) from public.couples) c, (select count(*) from auth.users) u"
          echo "== as the signed-in person"; q "create or replace function pg_temp.diag() returns json language plpgsql as \$f\$
          declare r json; uid uuid;
          begin
            select user_id into uid from public.members limit 1;
            perform set_config('request.jwt.claims', json_build_object('sub', uid, 'role', 'authenticated')::text, true);
            perform set_config('request.jwt.claim.sub', uid::text, true);
            perform set_config('role', 'authenticated', true);
            begin
              select json_build_object('uid_matches', auth.uid() = uid, 'my_couple', public.my_couple_id() is not null, 'members', (select count(*) from public.members), 'couples', (select count(*) from public.couples)) into r;
            exception when others then r := json_build_object('error', sqlerrm);
            end;
            return r;
          end \$f\$; select pg_temp.diag();"
